name: Proposal-first refactor

on:
  push:
    branches:
      - proposal-first-launch-gating

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal-first-launch-gating
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply scoped refactor
        run: node scripts/apply-proposal-first-refactor.mjs
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/affiliate/dashboard/promote/[offerId]/page.tsx app/affiliate/dashboard/promote/components/AdCampaignWizard.tsx app/business/my-business/ad-ideas/page.tsx app/api/meta/callback/upload-video/route.ts
          git commit -m "Refactor paid campaigns to proposal-first launch gating"
          git push origin proposal-first-launch-gating
