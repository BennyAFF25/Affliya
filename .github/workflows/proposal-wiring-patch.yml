name: Proposal wiring patch

on:
  push:
    paths:
      - .github/workflows/proposal-wiring-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire proposal handoff into Ad Ideas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/business/my-business/ad-ideas/page.tsx')
          text = path.read_text()

          page_anchor = 'export default function AdIdeasPage() {'
          helper = '''function currentAdIdeasReturnTo() {
            if (typeof window === "undefined") return "/business/my-business/ad-ideas";
            const proposalId = new URLSearchParams(window.location.search).get("proposal");
            return proposalId
              ? `/business/my-business/ad-ideas?proposal=${encodeURIComponent(proposalId)}`
              : "/business/my-business/ad-ideas";
          }

          '''
          assert page_anchor in text, 'AdIdeasPage anchor not found'
          assert 'function currentAdIdeasReturnTo()' not in text, 'returnTo helper already exists unexpectedly'
          text = text.replace(page_anchor, helper + page_anchor, 1)

          auth_pattern = re.compile(
              r'if \(session === null\) \{\s*router\.push\("/"\);\s*return;\s*\}'
          )
          auth_replacement = '''if (session === null) {
              const returnTo = currentAdIdeasReturnTo();
              router.push(`/login/business?returnTo=${encodeURIComponent(returnTo)}`);
              return;
            }'''
          text, auth_count = auth_pattern.subn(auth_replacement, text)
          assert auth_count == 2, f'expected 2 logged-out redirects, found {auth_count}'

          handle_anchor = '  const handleStatusChange = async ('
          highlight = '''  useEffect(() => {
            if (typeof window === "undefined" || ideas.length === 0) return;
            const proposalId = new URLSearchParams(window.location.search).get("proposal");
            if (!proposalId) return;

            const timer = window.setTimeout(() => {
              document.getElementById(`proposal-${proposalId}`)?.scrollIntoView({
                behavior: "smooth",
                block: "center",
              });
            }, 0);

            return () => window.clearTimeout(timer);
          }, [ideas]);

          '''
          assert handle_anchor in text, 'handleStatusChange anchor not found'
          text = text.replace(handle_anchor, highlight + handle_anchor, 1)

          pending_pattern = re.compile(r'<li key=\{idea\.id\}>')
          text, li_count = pending_pattern.subn(
              '<li key={idea.id} id={`proposal-${idea.id}`}>',
              text,
              count=1,
          )
          assert li_count == 1, f'expected one pending list item replacement, found {li_count}'

          view_pattern = re.compile(
              r'setSelectedIdea\(idea\);\s*setShowTargetingDetails\(false\);'
          )
          text, view_count = view_pattern.subn(
              'router.push(`/business/my-business/ad-ideas/${encodeURIComponent(idea.id)}`);',
              text,
              count=1,
          )
          assert view_count == 1, f'expected pending View details handler, found {view_count}'

          path.write_text(text)
          PY

      - name: Commit scoped patch
        run: |
          git config user.name "nettmark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/business/my-business/ad-ideas/page.tsx
          git diff --cached --check
          git commit -m "Wire Ad Ideas proposal handoff" || exit 0
          git push origin HEAD:main
