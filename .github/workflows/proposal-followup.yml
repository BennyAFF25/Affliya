name: Proposal flow follow-up

on:
  push:
    branches:
      - proposal-first-launch-gating

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal-first-launch-gating
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply follow-up patch
        run: node scripts/apply-proposal-followup.mjs
      - name: Validate whitespace
        run: git diff --check
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/affiliate/dashboard/promote/[offerId]/page.tsx app/business/my-business/ad-ideas/page.tsx app/affiliate/dashboard/manage-campaigns/page.tsx
          git commit -m "Complete proposal-first campaign states and notifications"
          git push origin proposal-first-launch-gating
