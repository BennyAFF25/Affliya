name: Validate proposal-first launch boundary

on:
  push:
    branches:
      - proposal-first-launch-gating

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal-first-launch-gating
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Apply final hardening
        run: node scripts/apply-launch-boundary-hardening.mjs
      - name: Validate diff whitespace
        run: git diff --check
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Typecheck touched launch boundary
        shell: bash
        run: |
          set +e
          yarn -s typecheck > /tmp/proposal-typecheck.log 2>&1
          code=$?
          cat /tmp/proposal-typecheck.log
          if [ "$code" -ne 0 ]; then
            if grep -E '^(app/api/business/ad-ideas/launch/route\.ts|app/api/meta/callback/upload-video/route\.ts|utils/paidCampaignLaunchReadiness\.ts|app/api/business/ad-ideas/review-readiness/route\.ts|app/api/business/ad-ideas/update-status/route\.ts|app/api/affiliate/pending-paid-proposals/route\.ts|app/api/affiliate/ad-ideas/notify-submitted/route\.ts)' /tmp/proposal-typecheck.log; then
              echo "Type errors found in proposal-first launch-boundary files."
              exit 1
            fi
            echo "Repository typecheck still has pre-existing errors outside the launch-boundary files; no errors were reported in the hardened server files."
          fi
      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/meta/callback/upload-video/route.ts app/api/business/ad-ideas/launch/route.ts
          git commit -m "Harden authenticated paid campaign launch boundary"
          git push origin proposal-first-launch-gating
