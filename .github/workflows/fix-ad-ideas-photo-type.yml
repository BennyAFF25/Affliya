name: Fix ad ideas photo type

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image proposal type
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/affiliate/dashboard/promote/[offerId]/page.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const before1 = 'type: videoFile ? "Video" : "Image",';
          const after1 = 'type: videoFile ? "Video" : "Photo",';
          const before2 = 'insertPayload.type = selectedAdBrandCreative.media_type === "video" ? "Video" : "Image";';
          const after2 = 'insertPayload.type = selectedAdBrandCreative.media_type === "video" ? "Video" : "Photo";';
          if (!source.includes(before1)) throw new Error('uploaded image type assignment not found');
          if (!source.includes(before2)) throw new Error('brand image type assignment not found');
          source = source.replace(before1, after1).replace(before2, after2);
          fs.writeFileSync(path, source);
          NODE
      - name: Verify database enum compatibility in source
        run: |
          grep -F 'type: videoFile ? "Video" : "Photo",' 'app/affiliate/dashboard/promote/[offerId]/page.tsx'
          grep -F 'insertPayload.type = selectedAdBrandCreative.media_type === "video" ? "Video" : "Photo";' 'app/affiliate/dashboard/promote/[offerId]/page.tsx'
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/affiliate/dashboard/promote/[offerId]/page.tsx'
          git commit -m "Fix ad idea photo type constraint"
          git push origin main
