name: Affiliate onboarding checks
on:
  push:
    branches: [codex/affiliate-onboarding-ai-v1]
  pull_request:
    paths:
      - "app/onboarding/for-partners/**"
      - "app/create-account/**"
      - "app/auth-redirect/**"
      - "app/login/affiliate/**"
      - "app/affiliate/dashboard/**"
      - "app/api/onboarding/affiliate-offers/**"
      - "app/api/affiliate/offers/**"
      - "app/api/profile/onboarding-complete/**"
      - "utils/affiliate/**"
      - "lib/affiliate/**"
      - "scripts/*affiliate*"
      - "tsconfig.affiliate-onboarding.json"
      - "eslint.affiliate-onboarding.config.mjs"
      - ".github/workflows/affiliate-onboarding.yml"
permissions:
  contents: read
jobs:
  regression-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --ignore-scripts
      - name: Check onboarding, approval and AI failure behavior
        run: yarn -s tsx scripts/affiliate-onboarding.test.ts
      - name: Strict typecheck new feature code
        run: yarn -s tsc --project tsconfig.affiliate-onboarding.json
      - name: Check existing integration files for new type errors
        run: yarn -s tsx scripts/check-affiliate-types.ts cb511b0301fb071aa3299528c706840b4ed09d2e
      - name: Lint new feature code
        run: yarn -s eslint --no-config-lookup --config eslint.affiliate-onboarding.config.mjs utils/affiliate lib/affiliate app/api/onboarding/affiliate-offers "app/api/affiliate/offers/[offerId]/generate-promotion" app/onboarding/for-partners app/affiliate/dashboard/promote/components/AIPromotionPackPanel.tsx app/affiliate/dashboard/promote/components/PromotionBackLink.tsx app/affiliate/layout.tsx
      - name: Install temporary browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/nettmark-onboarding-browser" --no-package-lock --ignore-scripts playwright@1.58.2
          google-chrome --version
      - name: Check actual Promote editor return navigation
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: NODE_PATH="$RUNNER_TEMP/nettmark-onboarding-browser/node_modules" node scripts/affiliate-promote-back.browser.cjs
      - name: Check mobile and desktop onboarding
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: NODE_PATH="$RUNNER_TEMP/nettmark-onboarding-browser/node_modules" node scripts/affiliate-onboarding.browser.cjs
      - name: Check policy reading and acceptance continuity
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: NODE_PATH="$RUNNER_TEMP/nettmark-onboarding-browser/node_modules" node scripts/legal-navigation.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affiliate-typecheck-report
          path: |
            affiliate-typecheck-report.json
            affiliate-next-step-mobile.png
            affiliate-next-step-server.log
            affiliate-promote-back-mobile.png
            affiliate-promote-back-server.log
            legal-policy-mobile.png
            legal-navigation-server.log
          if-no-files-found: ignore
