name: Proposal copy cleanup

on:
  push:
    paths:
      - .github/workflows/proposal-copy-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Keep proposal ownership language clear
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/business/my-business/ad-ideas/page.tsx')
          text = path.read_text()
          old = 'AFFILIATE_CAMPAIGN_FUNDING_REQUIRED: "Waiting for affiliate funding",'
          new = 'AFFILIATE_CAMPAIGN_FUNDING_REQUIRED: "Affiliate funding pending — no action required",'
          assert old in text, 'affiliate funding label not found'
          text = text.replace(old, new, 1)
          count = text.count('View details')
          assert count >= 1, 'View details label not found'
          text = text.replace('View details', 'View proposal')
          path.write_text(text)
          PY
          git config user.name "nettmark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/business/my-business/ad-ideas/page.tsx
          git diff --cached --check
          git commit -m "Clarify proposal actions in Ad Ideas" || exit 0
          git push origin HEAD:main
