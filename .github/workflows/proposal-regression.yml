name: Proposal regression validation

on:
  push:
    branches:
      - proposal-first-launch-gating

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal-first-launch-gating
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Align subscription regression with centralized launch boundary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/business-subscription-gate.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const oldBlock = `  for (const source of [launchRoute, metaRoute]) {\n    assert.match(source, /requireBusinessCampaignLaunchEntitlement/);\n    assert.match(source, /BUSINESS_SUBSCRIPTION_REQUIRED|subscriptionRequired|buildSubscriptionRequiredResponse/);\n  }`;
          const newBlock = `  assert.match(launchRoute, /requireBusinessCampaignLaunchEntitlement/);\n  assert.match(metaRoute, /requireBusinessCampaignLaunchEntitlement/);\n  assert.match(metaRoute, /BUSINESS_SUBSCRIPTION_REQUIRED|subscriptionRequired|buildSubscriptionRequiredResponse/);`;
          if (!source.includes(oldBlock)) throw new Error('Expected subscription gate assertion block not found');
          source = source.replace(oldBlock, newBlock);
          fs.writeFileSync(path, source);
          NODE
      - run: yarn install --frozen-lockfile
      - name: Business entitlements
        run: yarn -s test:business-entitlements
      - name: Business subscription gate
        run: yarn -s test:business-subscription-gate
      - name: Offer readiness
        run: yarn -s test:offer-readiness
      - name: Business payment gate placement
        run: yarn -s test:business-payment-gate-placement
      - name: Ad ideas review UI
        run: yarn -s test:ad-ideas-review-ui
      - name: Launch fund
        run: yarn -s test:launch-fund
      - name: Commit aligned regression assertion
        run: |
          if git diff --quiet -- scripts/business-subscription-gate.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/business-subscription-gate.test.ts
          git commit -m "Align subscription test with centralized launch gate"
          git push origin proposal-first-launch-gating
