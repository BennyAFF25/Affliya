client_id = "504d490cc8b4e692142ff5713bfa6de3"
name = "Nettmark"
application_url = "https://www.nettmark.com/api/shopify/install"
embedded = false

[access_scopes]
scopes = "write_pixels,read_customer_events"
# Standalone app uses the authorization-code grant implemented by /api/shopify/install.
# Shopify rejects app-specific topic subscriptions with the legacy install flow, so app/uninstalled
# (and app_subscriptions/update on the billing branch) are registered per shop in lib/shopify/admin.ts
# registerWebhooks() at the OAuth callback. Only the mandatory compliance topics live here.
use_legacy_install_flow = true

[auth]
redirect_urls = ["https://nettmark.com/api/shopify/callback", "https://www.nettmark.com/api/shopify/callback"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://www.nettmark.com/api/shopify/webhooks"
